version: "3.8"

# Local SearXNG metasearch — keyless, JSON-enabled.
# Used by server/sources/searxng.js when SEARXNG_URL is set.
#
# Usage:
#   docker compose -f searxng/docker-compose.yml up -d
#   Set SEARXNG_URL=http://127.0.0.1:8081 in .env
#
# Stop:
#   docker compose -f searxng/docker-compose.yml down

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: sourcing-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - BASE_URL=http://127.0.0.1:8081/
      - INSTANCE_NAME=sourcing-tool
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
